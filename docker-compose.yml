# Local development stack for the portal.
# Start:  docker compose up -d
# Stop:   docker compose down
# Values come from .env (copy .env.example to .env first).

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: ${WP_DEBUG:-1}
      # Marks this as a local development site (plugins and WordPress behave accordingly).
      WORDPRESS_CONFIG_EXTRA: "define( 'WP_ENVIRONMENT_TYPE', 'local' );"
    volumes:
      - wp_core:/var/www/html
      # Only OUR code is mounted from the repo. WordPress core, parent theme
      # and third-party plugins stay inside the container volume.
      - ./wp-content/themes/portal-child:/var/www/html/wp-content/themes/portal-child
      - ./wp-content/plugins/portal-core:/var/www/html/wp-content/plugins/portal-core
      # Local upload limits close to the live host's (Task 17D), see docker/php-uploads.ini.
      - ./docker/php-uploads.ini:/usr/local/etc/php/conf.d/portal-uploads.ini:ro

  wpcli:
    image: wordpress:cli-php8.2
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      - db
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
      WP_SITE_URL: ${WP_SITE_URL}
      WP_SITE_TITLE: ${WP_SITE_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      WORDPRESS_CONFIG_EXTRA: "define( 'WP_ENVIRONMENT_TYPE', 'local' );"
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes/portal-child:/var/www/html/wp-content/themes/portal-child
      - ./wp-content/plugins/portal-core:/var/www/html/wp-content/plugins/portal-core
      - ./scripts:/scripts:ro
    entrypoint: wp

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 128M

  # Catches every e-mail the local site sends (sign-up links, password resets) so nothing
  # reaches a real inbox. Read them at http://localhost:8025. portal-core sends mail here
  # only when the site is marked 'local' (includes/local-mail.php).
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  db_data:
  wp_core:
